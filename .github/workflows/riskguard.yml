name: My RiskGuard Bot
on:
  workflow_dispatch:
  schedule:
    # 🌟 هر ۶ ساعت و ۱ دقیقه اجرا می‌شود (۰۰:۰۱، ۰۶:۰۱، ۱۲:۰۱، ۱۸:۰۱)
    - cron: '1 */6 * * *' 

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Bot
        env:
          TT_API_KEY: ${{ secrets.TT_API_KEY }}
          TT_API_SECRET: ${{ secrets.TT_API_SECRET }}
        run: python riskguard.py
